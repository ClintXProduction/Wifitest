<script>
var totalCoinReceived = 0;
var insertcoinbg = new Audio('img/insertcoinbg.mp3');
insertcoinbg.loop = true;
var coinCount = new Audio('img/coin-received.mp3');
var macNoColon = replaceAll(mac, ":");
var voucher = macNoColon;
var insertingCoin = false;
var timer = null;

$("#voucherInput").val(macNoColon);

function replaceAll(str, rep){
	var aa = str;
	while(aa.indexOf(rep) > 0){
		aa = aa.replace(rep, "");
	}
	return aa;
}

$(document).ready(function(){  	
 if(disableVoucherInput){
	$("#voucherInput").attr("disabled", "disabled");
  }  
});

function nameBtn(){	
 var vc = $("#voucherInput").val(); 
 if(vc != macNoColon){
   $("#buttonRed").html("ADD VOUCHER");
 } else{
   if(vc == macNoColon){
       $("#buttonRed").html("CONNECT"); 
      }
    }
}	

document.addEventListener('visibilitychange', function (event) {
    if (document.hidden) {
        if(insertingCoin == true){

		}

});

function GRH() {
  if(insertingCoin == true){
		autoAction();
		}
}

function insertBtnAction(){
	totalCoinReceived = 0;	
	$('#totalCoin').html("0");
	$('#totalTime').html(secondsToDhms(parseInt(0)));
		$.ajax({
		  type: "GET",
		  url: "/status",
           success: function(data, textStatus, request){
              if ( data.indexOf("IAMNOTLOGINSTRINGPLEASEDONTREMOVE") < 0 ){
				  location.reload();
			  }else {
				  callTopupAPI(0);
			  }
           }
		});
	return false;
}

function callTopupAPI(retryCount){
	var ipAddCriteria = "";
	if( typeof uIp !== 'undefined' ){
		ipAddCriteria = "&ipAddress="+uIp;
	}	
	$.ajax({
	  type: "POST",
	  url: "http://"+vendorIpAddress+"/topUp",
	  data: "voucher="+voucher+"&mac="+mac+ipAddCriteria,
	  success: function(data){
		if(data.status == "true"){
			voucher = data.voucher;
			$('#insertCoinModal').modal('show');
			insertingCoin = true;
			if(timer == null){
				timer = setInterval(checkCoin, 1000);
			}
			insertcoinbg.play();
		}else{
		if(data.errorCode == "coin.slot.banned"){
			alert("Temporary Banned! due to multiple request for insert coin, please try again later!");
			}else
			if(data.errorCode == "coinslot.busy"){
			alert("Coin slot is busy at the moment..");
			}
		clearInterval(timer);
		 timer = null;
		}
	  },error: function (jqXHR, exception) {
		  setTimeout(function() {
			if(retryCount < 3){
				callTopupAPI(retryCount+1);
			}else{
			 alert("something went wrong please contact WiFi vendo owner!!");
			}
		  }, 1000 );
	  }
	});
}

function checkCoin(){
  $.ajax({
	  type: "POST",
	  url: "http://"+vendorIpAddress+"/checkCoin",
	  data: "voucher="+voucher,
	  success: function(data){
	    if(data.status == "true"){
			totalCoinReceived = parseInt(data.totalCoin);			
			$('#totalCoin').html(data.totalCoin);	
			$('#totalTime').html(secondsToDhms(parseInt(data.timeAdded)));
			coinCount.play();
	    }else{
		 if(data.errorCode == "coin.not.inserted"){
			var remainTime = parseInt(parseInt(data.remainTime)/1000);
			var waitTime = parseFloat(data.waitTime);
			var percent = parseInt(((remainTime*1000) / waitTime) * 100);
			totalCoinReceived = parseInt(data.totalCoin);
			
			if(remainTime == 0){
			    $('#insertCoinModal').modal('hide');
			     autoAction();
			    }else{
					totalCoinReceived = parseInt(data.totalCoin);
					$('#totalCoin').html(data.totalCoin);
				    $('#totalTime').html(secondsToDhms(parseInt(data.timeAdded)));
					$("#progressDiv").attr('style','width: '+percent+'%');
				}						 
		   }
		 }
	  }
  });
}
	
function autoAction(){
 $("#loaderDiv").attr("class","spinner");	  
    clearInterval(timer);
	timer = null;
	insertingCoin = false;
	insertcoinbg.pause();
	insertcoinbg.currentTime = 0.0;	
	   if(totalCoinReceived > 0 ){   
		$.ajax({
	          type: "POST",
	          url: "http://"+vendorIpAddress+"/useVoucher",
	          data: "voucher="+voucher,
	          success: function(data){
			      totalCoinReceived = 0; 					  
                  location.reload();
			  }
	    });   
 }else{
        $.ajax({
			  type: "POST",
			  url: "http://"+vendorIpAddress+"/cancelTopUp",
			  data: "voucher="+voucher+"&mac="+mac,
			  success: function(data){
                 location.reload();
			   }
	    });
      }
}
	 	 
function secondsToDhms(seconds) {
	seconds = Number(seconds);
	var d = Math.floor(seconds / (3600*24));
	var h = Math.floor(seconds % (3600*24) / 3600);
	var m = Math.floor(seconds % 3600 / 60);
	var s = Math.floor(seconds % 60);

	var dDisplay = d > 0 ? d + (d == 1 ? " Day " : " Days ") : "";
	var hDisplay = h > 0 ? h + (h == 1 ? "" : "") : "0";
	var mDisplay = m > 0 ? m + (m == 1 ? "" : "") : "0";
	var sDisplay = s > 0 ? s + (s == 1 ? "" : "") : "0";
	return dDisplay + " " + hDisplay + "h : " + mDisplay + "m : " + sDisplay + "s";
}
